# .github/workflows/tagpr.yml
name: tagpr
on:
  push:
    branches: ["main"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}
      - uses: Songmu/tagpr@v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

on:
  release:
    types: [published]

name: Upload Release Asset

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: takutakahashi/oci-image-operator
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: takutakahashi
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Build:image'
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}/manager:${{ github.event.release.tag_name }}
      - name: 'Build:image:actor-base'
        uses: docker/build-push-action@v7
        with:
          push: true
          file: actor/base/Dockerfile
          context: .
          tags: ghcr.io/${{ env.IMAGE_NAME }}/actor-base:${{ github.event.release.tag_name }}
      - name: 'Build:image:actor-registryv2'
        uses: docker/build-push-action@v7
        with:
          push: true
          file: actor/registryv2/Dockerfile
          context: .
          tags: ghcr.io/${{ env.IMAGE_NAME }}/actor-registryv2:${{ github.event.release.tag_name }}
      - name: 'Build:image:actor-github'
        uses: docker/build-push-action@v7
        with:
          push: true
          file: actor/github/Dockerfile
          context: .
          tags: ghcr.io/${{ env.IMAGE_NAME }}/actor-github:${{ github.event.release.tag_name }}

      - name: Build manifests
        run: make release IMG=ghcr.io/${{ env.IMAGE_NAME }}/manager:${{ github.event.release.tag_name }}

      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./release.yaml --clobber

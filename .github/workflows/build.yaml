on:
  push:
    branches:
      - beta
      - main
    # Sequence of patterns matched against refs/tags
    #tags:
    #- 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Build beta image

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: takutakahashi/oci-image-operator
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: takutakahashi
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Build:image'
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}/manager:beta
      - name: 'Build:image:actor-base'
        uses: docker/build-push-action@v7
        with:
          push: true
          file: actor/base/Dockerfile
          context: .
          tags: ghcr.io/${{ env.IMAGE_NAME }}/actor-base:beta
      - name: 'Build:image:actor-registryv2'
        uses: docker/build-push-action@v7
        with:
          push: true
          file: actor/registryv2/Dockerfile
          context: .
          tags: ghcr.io/${{ env.IMAGE_NAME }}/actor-registryv2:beta
      - name: 'Build:image:actor-github'
        uses: docker/build-push-action@v7
        with:
          push: true
          file: actor/github/Dockerfile
          context: .
          tags: ghcr.io/${{ env.IMAGE_NAME }}/actor-github:beta
      - name: 'Build:image:actor-noop'
        uses: docker/build-push-action@v7
        with:
          push: true
          file: actor/noop/Dockerfile
          context: .
          tags: ghcr.io/${{ env.IMAGE_NAME }}/actor-noop:beta
